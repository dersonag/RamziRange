# RamziRange9 - single entrypoint on :9600
server {
    listen 9600;
    server_name _;

    location / {
        proxy_pass http://rr9app:5000/;
        # $http_host (not $host) keeps the port, so the OpenAPI servers[].url
        # resolves to http://<ip>:9600 instead of port 80.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
